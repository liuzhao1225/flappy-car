<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Flappy Car share preview source</title>
<link rel="stylesheet" href="../assets/fonts/pixel.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#4ec0ca}
main{position:relative;width:1280px;height:720px;overflow:hidden;color:#273849;font-family:"Flappy Pixel",monospace;font-synthesis:none;padding:72px}
h1{font-size:96px;font-weight:400;line-height:1;margin:0;text-shadow:6px 6px #e1fff0}
p{font-size:36px;line-height:1.5;margin:18px 0 0}.car{position:absolute;left:90px;top:318px;width:520px;height:200px;image-rendering:pixelated}
.booster{position:absolute;right:104px;width:156px;height:960px;image-rendering:pixelated}.top{bottom:432px}.bottom{top:440px;transform:rotate(180deg)}
.jets{position:absolute;left:120px;top:460px;width:20px;height:90px;background:#edffff;box-shadow:340px 0 #edffff, -10px 10px #9ae4ed,10px 10px #9ae4ed,330px 10px #9ae4ed,350px 10px #9ae4ed}
.ground{position:absolute;left:0;right:0;bottom:0;height:48px;background:#e4db97;border-top:12px solid #7cc332;box-shadow:0 -6px #f4f8bd}
.url{position:absolute;right:48px;bottom:64px;font-size:24px;background:#fff3ce;padding:12px 18px;border:6px solid #273849;box-shadow:6px 6px #273849}
</style>
<main aria-label="Flappy Car 像素 Roadster 与星舰喷口">
<h1>FLAPPY CAR</h1><p>像素飞车 · 点击喷气</p>
<div class="jets"></div><img class="car" src="../assets/roadster.png" alt="白色像素 Roadster">
<img class="booster top" src="../assets/starship-booster.png" alt=""><img class="booster bottom" src="../assets/starship-booster.png" alt="">
<div class="ground"></div><div class="url">flappy-car.xiaoke.ai</div>
</main>
</html>
