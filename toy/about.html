<article>
<section><h2>怎么飞？</h2><p>点击 / 空格 / ↑ 喷气上升。避开星舰助推器与地面，每过一组得 1 分。P / Esc 暂停，M 切换音效。</p></section>
<section><h2>奖牌</h2><p>10 / 20 / 30 / 40 分依次获得铜、银、金、铂金 Doge 奖牌。</p></section>
<section><h2>排行榜</h2><p>保留周期内最高分，同分先达成者靠前。</p></section>
