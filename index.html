<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4ec0ca">
    <meta name="description" content="像素 Roadster 飞行游戏。点击、触摸或按空格喷气上升。">
    <title>Flappy Car</title>
    <link rel="icon" href="data:,">
    <link rel="preload" href="assets/atlas.png" as="image" fetchpriority="high">
    <link rel="preconnect" href="https://flappy-car-api.xiaoke.ai" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" href="assets/fonts/pixel/ui.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/fonts/pixel.css">
    <link rel="stylesheet" href="social.css">
    <script defer src="social.js"></script>
    <script defer src="seed.js"></script>
    <script defer src="assets/atlas.js"></script>
    <script defer src="engine.js"></script>
    <script defer src="game.js"></script>
  </head>
  <body>
    <main id="game" aria-label="Flappy Roadster" data-state="loading">
      <canvas id="screen" width="288" height="512" tabindex="0" aria-label="Flappy Roadster 游戏画面" aria-describedby="instructions"></canvas>
      <div id="controls">
        <button id="play" class="sprite-button" aria-label="开始游戏" hidden></button>
        <button id="scores" class="sprite-button" aria-label="查看排行榜" hidden></button>
        <button id="pause" class="sprite-button" aria-label="暂停游戏" hidden></button>
        <button id="resume" class="sprite-button" aria-label="继续游戏" hidden></button>
        <button id="menu" class="sprite-button" aria-label="返回主菜单" hidden></button>
      </div>
      <div id="social-actions"><button id="open-social" class="pixel-button">车手 / 好友</button><button id="share-result" class="pixel-button" hidden>分享成绩</button></div>
      <p id="social-status" role="status" aria-live="polite"></p>
      <p id="invite-status" role="status" aria-live="polite"></p>
      <p id="instructions" class="sr-only">点击画面、触摸屏幕或按空格、上方向键喷气上升。避开箭体和地面，每穿过一组喷口得一分。P 暂停，M 开关音效。</p>
      <p id="announcement" class="sr-only" aria-live="polite"></p>
      <div id="error" role="alert" hidden></div>
    </main>
    <noscript>请启用 JavaScript 后刷新页面。</noscript>
  </body>
</html>
